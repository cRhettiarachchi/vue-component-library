name: PR Agent
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    name: Run PR Agent code review (Codex)
    permissions:
      issues: write
      pull-requests: write
      contents: write
      checks: write
    steps:
      - name: PR Agent action step
        id: pragent
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          config.model: "gpt-5.6-terra"
          config.fallback_models: '["gpt-5.2-codex"]'
          # Auto-run tools on PR open/update (Action deployment's own toggles,
          # separate from the hosted GitHub App's [github_app].pr_commands).
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
          # Post /improve's suggestions as inline, committable review comments
          # instead of one summary table comment.
          pr_code_suggestions.commitable_code_suggestions: "true"
